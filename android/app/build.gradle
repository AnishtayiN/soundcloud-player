plugins {
    id "com.android.application"
}

def envOr = { String k, String d -> def v = System.getenv(k); return (v == null || v.isEmpty()) ? d : v }
def ksPath = System.getenv("KS_PATH")
// Release builds (CI tag / workflow_dispatch sets RELEASE_BUILD=true) must be signed with the real release key.
// The debug key is only allowed for local and non-published test builds.
if (System.getenv("RELEASE_BUILD") == "true" && (ksPath == null || ksPath.isEmpty() || !file(ksPath).exists()
        || System.getenv("KS_PASS") == null || System.getenv("KS_PASS").isEmpty()
        || System.getenv("KS_ALIAS") == null || System.getenv("KS_ALIAS").isEmpty())) {
    throw new GradleException("RELEASE_BUILD=true but the release keystore (KS_PATH / KS_PASS / KS_ALIAS) is missing - refusing to sign a release with the debug key")
}

android {
    namespace "com.soundclouddl.player"
    compileSdk 35

    defaultConfig {
        applicationId "com.soundclouddl.player"
        minSdk 24            // Android 7.0
        targetSdk 35         // Android 15 (installs on 16+ too)
        versionCode envOr("VERSION_CODE", "1").toInteger()
        versionName envOr("VERSION_NAME", "1.0.0")
    }

    signingConfigs {
        release {
            if (ksPath != null && new File(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KS_PASS")
                keyAlias System.getenv("KS_ALIAS")
                keyPassword System.getenv("KS_PASS")
                storeType "pkcs12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def hasKs = ksPath != null && new File(ksPath).exists()
            signingConfig = hasKs ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.webkit:webkit:1.11.0"
    // background release check + scheduled downloads (persisted across reboots, real network / charging constraints)
    implementation "androidx.work:work-runtime:2.9.1"
}
