name: Android E2E (App Links + renderer kill)

# Runs a published release APK on an Android emulator:
#   • https://soundclouddl-player.netlify.app/t/<id> must be a verified App Link that opens the app directly
#   • killing the WebView renderer must not kill the app; the WebView is rebuilt and the UI comes back
# Start manually (Actions → Android E2E → Run workflow) after a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (e.g. v1.3.1) — empty = latest"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then gh release download "$TAG" -R "${{ github.repository }}" -p SoundCloud-Player.apk -p SHA256SUMS
          else gh release download -R "${{ github.repository }}" -p SoundCloud-Player.apk -p SHA256SUMS; fi
          sha256sum -c --ignore-missing SHA256SUMS
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (Android 13, google_apis)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-e2e.sh
      - name: Upload screenshots + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: e2e-out/
