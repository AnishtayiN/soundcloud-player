name: Android E2E (App Links + renderer kill + player engine)

# Runs a published release APK on an Android emulator:
#   • https://soundclouddl-player.netlify.app/t/<id> must be a verified App Link that opens the app directly
#   • killing the WebView renderer must not kill the app; the WebView is rebuilt and the UI comes back
#   • engine: a debuggable APK built from the selected branch runs speed / EQ / sleep-timer checks inside the real
#     Android WebView over CDP (tests/native/cdp-check.mjs) — release builds keep WebView debugging off
# Start manually (Actions → Android E2E → Run workflow) after a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (e.g. v1.3.1) — empty = latest"
        required: false
        default: ""
      release_checks:
        description: "Also test the published release APK (App Links + renderer kill)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  emulator:
    if: ${{ github.event.inputs.release_checks != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then gh release download "$TAG" -R "${{ github.repository }}" -p SoundCloud-Player.apk -p SHA256SUMS
          else gh release download -R "${{ github.repository }}" -p SoundCloud-Player.apk -p SHA256SUMS; fi
          sha256sum -c --ignore-missing SHA256SUMS
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (Android 13, google_apis)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-e2e.sh
      - name: Upload screenshots + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: e2e-out/

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build a debuggable APK from this branch
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/* android/app/src/main/assets/www/
          cd android && gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../SoundCloud-Player-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Speed / EQ / sleep timer inside the Android WebView (Android 13)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash .github/scripts/android-engine.sh
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-engine-check
          path: e2e-engine/
